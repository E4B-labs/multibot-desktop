appId: com.e4b-labs.multibot
# Keep legacy appId so existing installs and macOS permissions upgrade in place.
productName: MultiBot
artifactName: MultiBot-${version}-${arch}.${ext}

publish:
  - provider: generic
    url: https://github.com/E4B-labs/multibot-desktop-releases/releases/latest/download

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/resources/speech-helper"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  - from: dist
    to: ui
  - from: dist-server
    to: server
  # multibot: platform-aware Claude Code installer used by Settings → CLI.
  - from: scripts/install-claude.mjs
    to: install-claude.mjs
  - from: scripts/install-codex.mjs
    to: install-codex.mjs
  # multibot: atrybucja dla dołączonych binariów (Tor, BSD-3-Clause).
  - from: THIRD-PARTY.md
    to: THIRD-PARTY.md

mac:
  # multibot: speech-helper to binarka ze Swifta (`pnpm build:speech`, swiftc
  # tylko na macOS) — jako wpis globalny wywracała build --win, bo pliku na
  # Windows nie ma. Sekcje `extraResources` łączą się z globalną.
  extraResources:
    - from: electron/resources/speech-helper
      to: speech-helper
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # multibot: ikona leży w repo (build/ jest w .gitignore, więc plik stamtąd
  # ginął na każdej świeżej kasie i paczka wychodziła z domyślną ikoną Electrona).
  icon: electron/resources/app-icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: MultiBot uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: MultiBot transcribes your voice on-device to type messages for you.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  artifactName: MultiBot-${version}.dmg

# multibot: Windows. Bez podpisu (brak certyfikatu) — instalator pokaże
# SmartScreen. icon.ico wygenerowana z build/icon-1024.png.
win:
  # multibot: tor.exe z Tor Expert Bundle leży w gitignorowanym
  # vendor/, więc `pnpm package:win` najpierw sprawdza, czy ktoś je pobrał
  # (`node scripts/fetch-tor.mjs`). Tylko Windows — mac/Linux używają
  # systemowego `tor` (PLAN-TOR D7). Sekcje `extraResources` łączą się z globalną,
  # a extraResources leżą poza asarem, więc rozpakowywanie nic tu nie zmienia:
  # ścieżka w runtime to `process.resourcesPath/tor/tor.exe`.
  extraResources:
    - from: vendor/tor/win-x64
      to: tor
  target:
    - target: nsis
      arch: x64
  icon: electron/resources/icon.ico

nsis:
  oneClick: false
  perMachine: false # instalacja per-user: bez UAC, apka pisze do %LOCALAPPDATA%
  allowToChangeInstallationDirectory: false # płynna auto-aktualizacja bez pytania o katalog
  createDesktopShortcut: true
  artifactName: MultiBot-${version}-${arch}-setup.${ext}
